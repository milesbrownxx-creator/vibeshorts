name: VibeShorts build check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build website
        run: npm run build
      - name: Upload deploy-ready website bundle
        uses: actions/upload-artifact@v4
        with:
          name: VibeShorts-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
